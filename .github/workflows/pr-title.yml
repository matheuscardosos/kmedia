name: PR Title and Traceability

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Conventional Commit title and issue traceability
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.actor }}
          SKIP_ISSUE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-issue') }}
        run: |
          node -e '
            const title = process.env.PR_TITLE ?? "";
            const conventional = /^(?:feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(?:\([a-z0-9._/-]+\))?!?: .+/u;
            if (!conventional.test(title)) {
              console.error("PR title must follow Conventional Commits, for example: feat(media): add trim marker support");
              process.exit(1);
            }

            if (process.env.PR_ACTOR === "dependabot[bot]" || process.env.SKIP_ISSUE === "true") {
              process.exit(0);
            }

            const body = process.env.PR_BODY ?? "";
            const hasIssueRef = /#[0-9]+/.test(body) || /No-Issue:\s*\S+/i.test(body);
            if (!hasIssueRef) {
              console.error("PR description must reference a GitHub issue (#123, Refs #123, Closes #123) or include a `No-Issue: <reason>` line (or the skip-issue label).");
              process.exit(1);
            }
          '
