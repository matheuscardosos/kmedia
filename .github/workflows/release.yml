name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-release
            qt_arch: linux_gcc_64
            artifact_id: kmedia-linux-x64
            artifact_name: kmedia-linux-x64.tar.gz
            artifact_glob: kmedia-linux-x64.tar.gz
          - os: windows-latest
            preset: windows-msvc-release
            qt_arch: win64_msvc2022_64
            artifact_id: kmedia-windows-x64
            artifact_name: kmedia-windows-x64.zip
            artifact_glob: kmedia-windows-x64*
          - os: macos-latest
            preset: macos-release
            qt_arch: clang_64
            artifact_id: kmedia-macos-arm64
            artifact_name: kmedia-macos-arm64.dmg
            artifact_glob: kmedia-macos-arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools qtwebsockets qtimageformats qtpdf'
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libmpv-dev libgl1-mesa-dev libegl1 libxcb-cursor0 libxkbcommon-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config mpv
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "MPV_ROOT=$(brew --prefix mpv)" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet ninja
          $mpvDir = Join-Path $env:RUNNER_TEMP "mpv-dev"
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          7z x $archive "-o$mpvDir" -y | Out-Null
          $dll = Join-Path $mpvDir "libmpv-2.dll"
          $exports = dumpbin /EXPORTS $dll
          $defLines = @("LIBRARY libmpv-2.dll", "EXPORTS")
          $inExports = $false
          foreach ($line in $exports) {
            if ($line -match "^\s*ordinal\s+hint") { $inExports = $true; continue }
            if ($inExports -and $line -match "^\s*Summary") { break }
            if ($inExports -and $line -match "^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") { $defLines += "  $($Matches[1])" }
          }
          $defFile = Join-Path $mpvDir "libmpv.def"
          $libDir = Join-Path $mpvDir "lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $defLines | Set-Content -Path $defFile -Encoding ASCII
          & lib.exe "/def:$defFile" "/machine:x64" "/out:$(Join-Path $libDir 'mpv.lib')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MPV_ROOT=$mpvDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Setup vcpkg
        shell: bash
        run: |
          VCPKG_DIR="${RUNNER_TEMP}/vcpkg"
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cmd //c "${VCPKG_DIR//\//\\}\\bootstrap-vcpkg.bat -disableMetrics"
          else
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg
            ~/AppData/Local/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure and Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Package Windows bundle and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build/${{ matrix.preset }}/kmedia.exe" "$dist/"
          Copy-Item "build/${{ matrix.preset }}/*.dll" "$dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE", "README.md", "THIRD-PARTY-NOTICES.md" "$dist/"

          windeployqt --qmldir resources/qml --no-compiler-runtime "$dist/kmedia.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Bundle app-local MSVC CRT DLLs so portable and per-user installs run without VC++ Redistributable.
          if ($env:VCToolsRedistDir) {
            $crtDir = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crtDir) {
              Copy-Item (Join-Path $crtDir.FullName "*.dll") "$dist/" -Force
            }
          }

          Compress-Archive -Path "$dist/*" -DestinationPath "dist/${{ matrix.artifact_name }}" -Force

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler (ISCC.exe) was not found."
            exit 1
          }

          $cmakeText = Get-Content -Path "CMakeLists.txt" -Raw
          if ($cmakeText -match 'VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            $appVersion = $Matches[1]
          } else {
            $appVersion = "0.1.0"
          }
          $numericVersion = "$appVersion.0"
          $repoRoot = (Resolve-Path ".").Path
          $distAbs = (Resolve-Path $dist).Path
          $outAbs = (Resolve-Path "dist").Path

          & $iscc `
            "/DAppVersion=$appVersion" `
            "/DNumericVersion=$numericVersion" `
            "/DSourceDir=$repoRoot" `
            "/DDistDir=$distAbs" `
            "/DOutputDir=$outAbs" `
            "/DOutputBaseFilename=kmedia-windows-x64-setup" `
            "packaging/windows/kmedia.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/macos
          cp -R "build/${{ matrix.preset }}/kmedia.app" dist/macos/
          macdeployqt dist/macos/kmedia.app -qmldir=resources/qml -always-overwrite
          hdiutil create -volname "KMedia" -srcfolder dist/macos -ov -format UDZO "dist/${{ matrix.artifact_name }}"

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/kmedia-linux-x64/bin dist/kmedia-linux-x64/share
          cp "build/${{ matrix.preset }}/kmedia" dist/kmedia-linux-x64/bin/
          cp LICENSE README.md THIRD-PARTY-NOTICES.md dist/kmedia-linux-x64/share/
          tar -czf "dist/${{ matrix.artifact_name }}" -C dist kmedia-linux-x64

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_id }}
          path: dist/${{ matrix.artifact_glob }}

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-files/*
