name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install Qt 6.8.3
        if: matrix.language == 'c-cpp'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: 'qtshadertools qtwebsockets qtimageformats qtpdf qtsvg'
          cache: true

      - name: Install Linux C++ dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libmpv-dev libgl1-mesa-dev libegl1 libxcb-cursor0 libxkbcommon-dev

      - name: Setup vcpkg
        if: matrix.language == 'c-cpp'
        run: |
          VCPKG_DIR="${RUNNER_TEMP}/vcpkg"
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary archives
        if: matrix.language == 'c-cpp'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build C++ targets for CodeQL
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
