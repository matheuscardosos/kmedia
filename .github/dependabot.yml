version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docs-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is incompatible with current vue-tsc / VitePress tooling.
      - dependency-name: typescript
        versions: ['>= 7.0.0']
